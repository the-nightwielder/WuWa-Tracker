name: WuWa Intelligence Feed

on:
  schedule:
    - cron: '0 0 * * *'
  push:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: wuwa-feed
  cancel-in-progress: true

jobs:
  build-feed:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Install locked pipeline dependencies
        run: python -m pip install --require-hashes -r data-pipeline/requirements.txt

      - name: Run security regression tests
        run: python -m unittest discover -s tests -v

      - name: Build structured intelligence feed
        run: python data-pipeline/aggregator.py

      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - name: Prepare public feed
        run: |
          mkdir -p public
          cp data-pipeline/feed.json public/feed.json

      - name: Upload feed artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: ./public

  deploy-pages:
    needs: build-feed
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
